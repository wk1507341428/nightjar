services:
  sidejob-web:
    build:
      context: ../inventory-radar
      dockerfile: Dockerfile
      args:
        VITE_SIDEJOB_API_URL: /api
    image: sidejob-web:local
    container_name: sidejob-web
    restart: unless-stopped
    ports:
      - "9300:80"
    depends_on:
      sidejob-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  sidejob-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: sidejob-api:local
    container_name: sidejob-api
    restart: unless-stopped
    expose:
      - "9800"
    environment:
      SIDEJOB_HOST: 0.0.0.0
      SIDEJOB_PORT: "9800"
      SIDEJOB_MONGO_URI: mongodb://${MONGO_USERNAME:-sidejob}:${MONGO_PASSWORD:-sidejob-dev}@mongodb:27017/?authSource=admin
      SIDEJOB_MONGO_DATABASE: sidejob
      SIDEJOB_SESSION_KEY_PATH: /var/lib/sidejob/session.key
      SIDEJOB_ALLOWED_ORIGINS: http://127.0.0.1:9300,http://localhost:9300
      TZ: Asia/Shanghai
    volumes:
      - ../runtime:/var/lib/sidejob
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9800/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    # Docker Desktop 当前内核与新版 MongoDB 镜像不兼容，本地固定为 8.0.4。
    image: mongo:8.0.4
    container_name: sidejob-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-sidejob}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-sidejob-dev}
    volumes:
      - sidejob-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sidejob-mongodb-data:
